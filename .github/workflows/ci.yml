# Workflow de Integração Contínua (CI)
# Objetivo: executar testes unitários a cada push na branch principal.
# Estrutura mantida simples e preparada para expansão futura
# (ex.: adicionar novos jobs como integração, e2e, build e deploy).

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_SCOPE: davidandradees-projects

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Faz checkout do código-fonte para o ambiente do runner
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      # Configura a versão do Node.js definida globalmente
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto via Yarn
      - name: Install dependencies
        run: yarn install

      # Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test
  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Obter as configurações do vercel
      # - name: Pull Vercel Config
      #   run: |
      #     yarn vercel pull --yes \
      #     --environment=preview \
      #     --token=$VERCEL_TOKEN \
      #     --scope=$VERCEL_SCOPE
      
      # 6. Build para o Vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # 7. Deploy preview no vercel
      - name: Deploy preview
        id: deploy
        run: yarn vercel deploy --prebuilt --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
        # run: |
        #   URL=$(yarn --silent vercel deploy --prebuilt \
        #   --target=preview \
        #   --token=$VERCEL_TOKEN \
        #   --scope=$VERCEL_SCOPE)
        #   echo "deployment-url=$URL" >> $GITHUB_OUTPUT