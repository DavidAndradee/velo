# Workflow de Integração Contínua (CI)
# Objetivo: executar testes unitários a cada push na branch principal.
# Estrutura mantida simples e preparada para expansão futura
# (ex.: adicionar novos jobs como integração, e2e, build e deploy).

name: Continuous Integration

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # Faz checkout do código-fonte para o ambiente do runner
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      # Configura a versão do Node.js definida globalmente
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # Instala as dependências do projeto via Yarn
      - name: Install dependencies
        run: yarn install

      # Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test
